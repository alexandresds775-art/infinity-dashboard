canvas{width:100%;height:250px}

table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th{background:#F9FAFB;padding:1rem;text-align:left;font-size:.75rem;text-transform:uppercase;color:var(--text-light);border-bottom:1px solid #E5E7EB}
td{padding:1rem;border-bottom:1px solid #F3F4F6;font-size:.875rem}
.row-promotor{border-left:4px solid var(--success)}
.row-neutro{border-left:4px solid var(--warning)}

.tag-neg{background:#FEE2E2;color:#991B1B}

.insights-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
